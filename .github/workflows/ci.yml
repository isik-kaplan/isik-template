name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      # For test_lockfiles.py's package-lock.json; nothing else here installs.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync
      - run: >-
          uv run pytest tests/test_bake_structure.py tests/test_pre_gen_validate.py tests/test_lockfiles.py
          tests/test_legal.py

  pre-gen-validate-mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync
      # mutmut exits 0 with survivors; check_mutants.py is what fails the build.
      - name: Run mutation tests
        run: uv run python scripts/mutmut_run.py run
      - name: Check for unexplained survivors
        run: uv run python scripts/check_mutants.py

  docker-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync
      # test_rate_limits.py boots the real nginx between stand-ins, building only the server image.
      - run: uv run pytest tests/test_docker_compose.py tests/test_rate_limits.py

  # Runs the generated ci.yml for real in a sandbox repo, which also catches bugs in the workflow file itself.
  bake-real-ci:
    runs-on: ubuntu-latest
    # The script polls unbounded; cold backend-mutation alone has taken 76-94 minutes.
    timeout-minutes: 150
    concurrency:
      group: bake-real-ci
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync
      - name: Bake and trigger the generated project's real CI
        env:
          BAKE_SANDBOX_TOKEN: ${{ secrets.BAKE_SANDBOX_TOKEN }}
          GH_TOKEN: ${{ secrets.BAKE_SANDBOX_TOKEN }}
        run: uv run python scripts/bake_and_trigger_real_ci.py

  # bake-real-ci runs with OIDC on, so the login page without provider buttons is covered only here.
  e2e-no-social-login:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest tests/test_e2e.py

  # With bake-real-ci's "default", these contexts cover every pair of service answers.
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        context: [minimal, self-tls, beat-disk-self-tls, celery-disk, inline-garage-self-tls]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest "tests/test_backend.py::test_the_backend_suite_passes[${{ matrix.context }}]"

  # Certbot issues against Pebble through the generated nginx; only the server image is built.
  self-tls-certificate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest tests/test_self_tls.py
