name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest tests/test_bake_structure.py tests/test_pre_gen_validate.py

  pre-gen-validate-mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync
      # mutmut itself exits 0 regardless of survivors - check_mutants.py is what actually fails
      # the build on one, unless it's an explained entry in mutation-exemptions.toml.
      - name: Run mutation tests
        run: uv run mutmut run
      - name: Check for unexplained survivors
        run: uv run python scripts/check_mutants.py

  docker-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest tests/test_docker_compose.py

  # Bakes the default context, force-pushes it to a dedicated sandbox repo, and waits for that
  # repo's own GitHub Actions to run the *real* generated ci.yml - lint, backend, backend-mutation,
  # frontend, frontend-mutation and e2e, exactly as a real user's push would trigger them. This
  # replaces separately hand-mirroring each of those jobs' commands here: a real run also catches
  # bugs in the workflow file itself (trigger conditions, job graph, cache/action syntax) that no
  # amount of replaying commands by hand ever could - see scripts/bake_and_trigger_real_ci.py.
  bake-real-ci:
    runs-on: ubuntu-latest
    # Backstop against a hung sandbox run: the script itself polls with no upper bound, so this is
    # what actually caps it - frontend-mutation (a cold Stryker run against the whole suite) is the
    # slowest job observed so far, comfortably under an hour but not by a wide enough margin to cap
    # at 60.
    timeout-minutes: 90
    concurrency:
      group: bake-real-ci
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync
      - name: Bake and trigger the generated project's real CI
        env:
          BAKE_SANDBOX_TOKEN: ${{ secrets.BAKE_SANDBOX_TOKEN }}
          GH_TOKEN: ${{ secrets.BAKE_SANDBOX_TOKEN }}
        run: uv run python scripts/bake_and_trigger_real_ci.py

  # The "no-social-login" context renders a different login/signup page (no provider buttons, no
  # divider above the form) that bake-real-ci's "default" bake never exercises - it's how a bare
  # "or" divider with nothing above it once shipped unnoticed. Everything else about that job's e2e
  # coverage (default context, every other spec) now runs for real via bake-real-ci instead.
  e2e-no-social-login:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest tests/test_e2e.py
