services:
  database:
    build:
      context: ./database
    image: ${COMPOSE_PROJECT_NAME:-{{ cookiecutter.repo_slug }}}-database:latest
    # Its own credentials, not all of .env: each service holds only the secrets it needs.
    environment:
      POSTGRES_DB: {{ '${' + cookiecutter.config_prefix + '__DB__NAME}' }}
      POSTGRES_USER: {{ '${' + cookiecutter.config_prefix + '__DB__USER}' }}
      POSTGRES_PASSWORD: {{ '${' + cookiecutter.config_prefix + '__DB__PASSWORD}' }}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "{{ '${' + cookiecutter.config_prefix + '__DB__USER}' }}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

{%- if cookiecutter.background_jobs != "inline" %}

  broker:
    build:
      context: ./broker
    image: ${COMPOSE_PROJECT_NAME:-{{ cookiecutter.repo_slug }}}-broker:latest
    environment:
      RABBITMQ_DEFAULT_USER: {{ '${' + cookiecutter.config_prefix + '__BROKER__USER}' }}
      RABBITMQ_DEFAULT_PASS: {{ '${' + cookiecutter.config_prefix + '__BROKER__PASSWORD}' }}
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 10

{%- endif %}
{%- if cookiecutter.cache == "redis" %}

  # Rate-limit counts and the cache: nothing in it needs to survive a restart, so no persistence.
  cache:
    image: redis:8.8-alpine
    command:
      - redis-server
      - --requirepass
      - {{ '${' + cookiecutter.config_prefix + '__CACHE__PASSWORD}' }}
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    environment:
      # For the healthcheck's redis-cli; the server takes --requirepass.
      REDISCLI_AUTH: {{ '${' + cookiecutter.config_prefix + '__CACHE__PASSWORD}' }}
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
{%- endif %}
{%- if cookiecutter.storage != "disk" %}
{% if cookiecutter.storage == "garage" %}
  # S3-compatible object storage: Garage, one node, in dev, tests and production alike.
{%- else %}
  # S3-compatible object storage for local dev and tests only; a deployment uses its provider's.
{%- endif %}
  storage:
    build:
      context: ./storage
    image: ${COMPOSE_PROJECT_NAME:-{{ cookiecutter.repo_slug }}}-storage:latest
{%- if cookiecutter.storage == "s3" %}
    profiles: ["local-storage"]
{%- endif %}
    environment:
      # The entrypoint ensures this key and bucket on every start; the app never creates one.
      BUCKET_NAME: {{ '${' + cookiecutter.config_prefix + '__STORAGE__BUCKET_NAME}' }}
      REGION_NAME: {{ '${' + cookiecutter.config_prefix + '__STORAGE__REGION_NAME}' }}
      ACCESS_KEY_ID: {{ '${' + cookiecutter.config_prefix + '__STORAGE__ACCESS_KEY_ID}' }}
      SECRET_ACCESS_KEY: {{ '${' + cookiecutter.config_prefix + '__STORAGE__SECRET_ACCESS_KEY}' }}
      RPC_SECRET: {{ '${' + cookiecutter.config_prefix + '__STORAGE__RPC_SECRET}' }}
      KEY_CAN_CREATE_BUCKETS: {{ '${' + cookiecutter.config_prefix + '__STORAGE__KEY_CAN_CREATE_BUCKETS}' }}
    volumes:
      - storage_data:/var/lib/garage
    networks:
      - internal
      # Docker publishes no ports for a container on internal networks only.
      - external
    ports:
      # Loopback only, for inspecting by hand.
      - "127.0.0.1:{{ '${' + cookiecutter.config_prefix + '__STORAGE__PORT:-3900}' }}:3900"
    restart: unless-stopped
    healthcheck:
      # Ready only once the key and bucket exist, so the backend never starts before them.
      test: ["CMD-SHELL", "test -f /tmp/ready && garage status >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
{%- endif %}

  backend:
    build:
      context: ./{{ cookiecutter.project_slug }}
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-{{ cookiecutter.repo_slug }}}-backend:latest
    env_file: .env
    volumes:
      - ./{{ cookiecutter.project_slug }}:/{{ cookiecutter.project_slug }}
{%- if cookiecutter.storage == "disk" %}
      - media:/media
{%- endif %}
    networks:
      internal:
        # nginx targets this, not "backend": on two networks the bare name may resolve to either one.
        aliases:
          - backend-internal
      external:
    depends_on:
      database:
        condition: service_healthy
{%- if cookiecutter.background_jobs != "inline" %}
      broker:
        condition: service_healthy
{%- endif %}
{%- if cookiecutter.cache == "redis" %}
      cache:
        condition: service_healthy
{%- endif %}
{%- if cookiecutter.storage != "disk" %}
      storage:
        condition: service_healthy
{%- if cookiecutter.storage == "s3" %}
        # Only while the local-storage profile runs it.
        required: false
{%- endif %}
{%- endif %}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health/"]
      interval: 10s
      timeout: 5s
      retries: 10
{%- if cookiecutter.background_jobs != "inline" %}

  worker:
    image: ${COMPOSE_PROJECT_NAME:-{{ cookiecutter.repo_slug }}}-backend:latest
    command: celery -A {{ cookiecutter.project_slug }} worker
    env_file: .env
    volumes:
      - ./{{ cookiecutter.project_slug }}:/{{ cookiecutter.project_slug }}
{%- if cookiecutter.storage == "disk" %}
      - media:/media
{%- endif %}
    networks:
      - internal
      - external
    depends_on:
      database:
        condition: service_healthy
      broker:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
{%- if cookiecutter.background_jobs == "celery-with-beat" %}

  scheduler:
    image: ${COMPOSE_PROJECT_NAME:-{{ cookiecutter.repo_slug }}}-backend:latest
    command: celery -A {{ cookiecutter.project_slug }} beat --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    volumes:
      - ./{{ cookiecutter.project_slug }}:/{{ cookiecutter.project_slug }}
{%- if cookiecutter.storage == "disk" %}
      - media:/media
{%- endif %}
    networks:
      - internal
      - external
    depends_on:
      database:
        condition: service_healthy
      broker:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
{%- endif %}
{%- endif %}

  # The frontend suites, as CI runs them: `docker compose run --rm frontend-test`.
  frontend-test:
    build:
      context: ./{{ cookiecutter.project_slug }}-frontend
      dockerfile: apps/web/Dockerfile
      target: tester
    image: ${COMPOSE_PROJECT_NAME:-{{ cookiecutter.repo_slug }}}-frontend-test:latest
    profiles: ["test"]
    working_dir: /repo
    volumes:
      # Live sources, but the image's own node_modules, which are built for its platform.
      - ./{{ cookiecutter.project_slug }}-frontend:/repo
      - /repo/node_modules
      - /repo/apps/web/node_modules
      - /repo/packages/api/node_modules
      - /repo/packages/auth-api/node_modules

  frontend:
    build:
      context: ./{{ cookiecutter.project_slug }}-frontend
      dockerfile: apps/web/Dockerfile
      args:
        # The one build-time value: next build inlines it into the client bundle.
        NEXT_PUBLIC_SENTRY_DSN: {{ '${NEXT_PUBLIC_SENTRY_DSN:-}' }}
    image: ${COMPOSE_PROJECT_NAME:-{{ cookiecutter.repo_slug }}}-frontend:latest
    # Named one by one: none of the backend's secrets belong in the public-facing process.
    environment:
{%- set server_sentry_dsn = cookiecutter.config_prefix + '_SERVER__SENTRY__DSN' %}
      {{ cookiecutter.config_prefix }}__DOMAIN: {{ '${' + cookiecutter.config_prefix + '__DOMAIN}' }}
      {{ cookiecutter.config_prefix }}__OAUTH_PROVIDER__MODE: {{ '${' + cookiecutter.config_prefix + '__OAUTH_PROVIDER__MODE:-off}' }}
      {{ cookiecutter.config_prefix }}__SOCIAL_LOGIN__PROVIDERS: {{ '${' + cookiecutter.config_prefix + '__SOCIAL_LOGIN__PROVIDERS:-}' }}
      {{ cookiecutter.config_prefix }}__SOCIAL_LOGIN__ICONS: {{ '${' + cookiecutter.config_prefix + '__SOCIAL_LOGIN__ICONS:-}' }}
      {{ server_sentry_dsn }}: {{ '${' + server_sentry_dsn + ':-}' }}
      # A secret, so under the server-only prefix.
      {{ cookiecutter.config_prefix }}_SERVER__FRONTEND_KEY: {{ '${' + cookiecutter.config_prefix + '__FRONTEND_KEY:-}' }}
{%- if cookiecutter.tls_termination == "external" %}
      # Written by scripts/dev-tls.sh.
      NODE_EXTRA_CA_CERTS: {{ '${NODE_EXTRA_CA_CERTS:-}' }}
{%- endif %}
      # Must outlast nginx's upstream keepalive_timeout, or nginx reuses connections Node already closed.
      KEEP_ALIVE_TIMEOUT: 65000
    networks:
      internal:
        aliases:
          - frontend-internal
      external:
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Not "/": that renders the root layout, which calls the backend.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/manifest.webmanifest"]
      interval: 10s
      timeout: 5s
      retries: 10

  # The only service publishing a host port.
  server:
    build:
      context: ./{{ cookiecutter.project_slug }}-server
    image: ${COMPOSE_PROJECT_NAME:-{{ cookiecutter.repo_slug }}}-server:latest
    # entrypoint.sh renders the nginx template with every variable here.
    environment:
      {{ cookiecutter.config_prefix }}__DOMAIN: {{ '${' + cookiecutter.config_prefix + '__DOMAIN}' }}
      {{ cookiecutter.config_prefix }}__FRONTEND_KEY: {{ '${' + cookiecutter.config_prefix + '__FRONTEND_KEY:-}' }}
      {{ cookiecutter.config_prefix }}__TRUSTED_PROXY_COUNT: {{ '${' + cookiecutter.config_prefix + '__TRUSTED_PROXY_COUNT:-' }}{% if cookiecutter.tls_termination == "self" %}1{% else %}2{% endif %}}
      {{ cookiecutter.config_prefix }}__RATE_LIMITS__ENABLED: {{ '${' + cookiecutter.config_prefix + '__RATE_LIMITS__ENABLED:-true}' }}
      {{ cookiecutter.config_prefix }}__RATE_LIMITS__REQUESTS_PER_SECOND: {{ '${' + cookiecutter.config_prefix + '__RATE_LIMITS__REQUESTS_PER_SECOND:-20}' }}
{%- if cookiecutter.tls_termination == "self" or cookiecutter.storage == "disk" %}
    volumes:
{%- if cookiecutter.tls_termination == "self" %}
      - letsencrypt:/etc/letsencrypt
      - acme_webroot:/var/www/certbot
{%- endif %}
{%- if cookiecutter.storage == "disk" %}
      # Read-only: nginx sends stored files once the backend has said who may have one.
      - media:/media:ro
{%- endif %}
{%- endif %}
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
{%- if cookiecutter.tls_termination == "self" %}
      # Every interface: nothing sits in front, and certbot's HTTP-01 challenge needs 80 too.
      - "80:80"
      - "443:443"
{%- else %}
      - "{{ '${' + cookiecutter.config_prefix + '__HTTP_BIND:-127.0.0.1}' }}:{{ '${' + cookiecutter.config_prefix + '__HTTP_PORT:-80}' }}:80"
{%- endif %}
    networks:
      internal:
        # So the frontend's server-side fetches go through nginx like a browser's, not straight to the backend.
        aliases:
          - api.{{ '${' + cookiecutter.config_prefix + '__DOMAIN}' }}
          - admin.{{ '${' + cookiecutter.config_prefix + '__DOMAIN}' }}
          - auth.{{ '${' + cookiecutter.config_prefix + '__DOMAIN}' }}
      # Docker publishes no ports for a container on internal networks only.{% if cookiecutter.storage == "s3" %} Also nginx's way out to the provider's bucket.{% endif %}
      external:
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
{% if cookiecutter.tls_termination == "self" %}
  # Issues and renews the certificate; nginx reloads periodically to pick it up from the shared volume.
  certbot:
    image: certbot/certbot:latest
    volumes:
      - letsencrypt:/etc/letsencrypt
      - acme_webroot:/var/www/certbot
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        trap exit TERM;
        certbot certonly --webroot -w /var/www/certbot
        -d {{ '${' + cookiecutter.config_prefix + '__DOMAIN}' }}
        -d api.{{ '${' + cookiecutter.config_prefix + '__DOMAIN}' }}
        -d admin.{{ '${' + cookiecutter.config_prefix + '__DOMAIN}' }}
        -d auth.{{ '${' + cookiecutter.config_prefix + '__DOMAIN}' }}
        --email {{ '${' + cookiecutter.config_prefix + '__TLS__ACME_EMAIL}' }}
        --agree-tos --non-interactive --keep-until-expiring;
        while true; do certbot renew; sleep 12h; done;
{% endif %}
volumes:
  postgres_data:
{%- if cookiecutter.storage == "disk" %}
  media:
{%- else %}
  storage_data:
{%- endif %}
{%- if cookiecutter.tls_termination == "self" %}
  letsencrypt:
  acme_webroot:
{%- endif %}

networks:
  internal:
    internal: true
  external:
    driver: bridge
