services:
  database:
    build:
      context: ./database
    image: {{ cookiecutter.repo_slug }}-database:latest
    env_file: .env
    environment:
      POSTGRES_DB: {{ '${' + cookiecutter.config_prefix + '__DB__NAME}' }}
      POSTGRES_USER: {{ '${' + cookiecutter.config_prefix + '__DB__USER}' }}
      POSTGRES_PASSWORD: {{ '${' + cookiecutter.config_prefix + '__DB__PASSWORD}' }}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "{{ '${' + cookiecutter.config_prefix + '__DB__USER}' }}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  broker:
    build:
      context: ./broker
    image: {{ cookiecutter.repo_slug }}-broker:latest
    env_file: .env
    environment:
      RABBITMQ_DEFAULT_USER: {{ '${' + cookiecutter.config_prefix + '__BROKER__USER}' }}
      RABBITMQ_DEFAULT_PASS: {{ '${' + cookiecutter.config_prefix + '__BROKER__PASSWORD}' }}
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 10

  backend:
    build:
      context: ./{{ cookiecutter.project_slug }}
      dockerfile: Dockerfile
    image: {{ cookiecutter.repo_slug }}-backend:latest
    env_file: .env
    volumes:
      - ./{{ cookiecutter.project_slug }}:/{{ cookiecutter.project_slug }}
      - /{{ cookiecutter.project_slug }}/.venv
    networks:
      internal:
        # nginx's named upstream (server/template.nginx.conf) targets this, not the bare
        # "backend" service name - a container on more than one network answers to its bare name
        # on *either* one, which leaves DNS free to hand back whichever address resolved first
        # instead of reliably this network's.
        aliases:
          - backend-internal
      external:
    depends_on:
      database:
        condition: service_healthy
      broker:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health/"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    image: {{ cookiecutter.repo_slug }}-backend:latest
    command: celery -A {{ cookiecutter.project_slug }} worker
    env_file: .env
    volumes:
      - ./{{ cookiecutter.project_slug }}:/{{ cookiecutter.project_slug }}
      - /{{ cookiecutter.project_slug }}/.venv
    networks:
      - internal
      - external
    depends_on:
      database:
        condition: service_healthy
      broker:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    image: {{ cookiecutter.repo_slug }}-backend:latest
    command: celery -A {{ cookiecutter.project_slug }} beat --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    volumes:
      - ./{{ cookiecutter.project_slug }}:/{{ cookiecutter.project_slug }}
      - /{{ cookiecutter.project_slug }}/.venv
    networks:
      - internal
      - external
    depends_on:
      database:
        condition: service_healthy
      broker:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./{{ cookiecutter.project_slug }}-frontend
      dockerfile: apps/web/Dockerfile
      args:
        # Build-time by necessity - next build inlines it into the client bundle. Every other
        # frontend value is read at runtime from env_file below.
        NEXT_PUBLIC_SENTRY_DSN: {{ '${NEXT_PUBLIC_SENTRY_DSN:-}' }}
    image: {{ cookiecutter.repo_slug }}-frontend:latest
    env_file: .env
    environment:
      # Node's http.Server default (5000ms) is shorter than nginx's upstream keepalive_timeout
      # to this container (server/template.nginx.conf) - nginx would keep reusing a connection
      # this server had already dropped, reproducing the exact uwsgi keep-alive bug one hop over.
      # Must stay longer than every upstream keepalive_timeout pointed at this container.
      KEEP_ALIVE_TIMEOUT: 65000
    networks:
      internal:
        aliases:
          - frontend-internal
      external:
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Not "/" - that renders the root layout, which calls getSession() and reaches out to the
      # backend; manifest.webmanifest is a plain route handler, unaffected, and already fast.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/manifest.webmanifest"]
      interval: 10s
      timeout: 5s
      retries: 10

  # The only service publishing a host port. Unlike a dynamic multi-tenant setup, this domain is
  # fixed and known at generation time, so nginx routes by a small, explicit set of server_name
  # blocks (see server/template.nginx.conf) rather than anything wildcard/dynamic.
  server:
    build:
      context: ./{{ cookiecutter.project_slug }}-server
    image: {{ cookiecutter.repo_slug }}-server:latest
    env_file: .env
{%- if cookiecutter.tls_termination == "self" %}
    volumes:
      - letsencrypt:/etc/letsencrypt
      - acme_webroot:/var/www/certbot
{%- endif %}
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
{%- if cookiecutter.tls_termination == "self" %}
      # Both on every interface, not 127.0.0.1 - nothing else sits in front of this container in
      # self-termination mode, so the public internet has to reach both directly (80 for
      # certbot's HTTP-01 challenge and the plain-http->https redirect, 443 for everything else).
      - "80:80"
      - "443:443"
{%- else %}
      - "127.0.0.1:{{ '${' + cookiecutter.config_prefix + '__HTTP_PORT:-80}' }}:80"
{%- endif %}
    networks:
      internal:
        # The frontend's own SSR fetches resolve these the same way a browser's requests do -
        # straight to backend (as they did before) would let SSR silently take a different path
        # through the stack than the browser, which is exactly what let a keep-alive mismatch
        # between nginx and uwsgi go unnoticed: nginx's access log never saw that traffic, and
        # every fix aimed at nginx accordingly missed the hop that mattered.
        aliases:
          - api.{{ '${' + cookiecutter.config_prefix + '__DOMAIN}' }}
          - admin.{{ '${' + cookiecutter.config_prefix + '__DOMAIN}' }}
          - auth.{{ '${' + cookiecutter.config_prefix + '__DOMAIN}' }}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
{% if cookiecutter.tls_termination == "self" %}
  # Only job: get the first real certificate and keep renewing it - nginx (server/entrypoint.sh)
  # reloads periodically on its own to pick up whatever lands in the shared `letsencrypt` volume,
  # so this never needs to reach into that container.
  certbot:
    image: certbot/certbot:latest
    volumes:
      - letsencrypt:/etc/letsencrypt
      - acme_webroot:/var/www/certbot
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        trap exit TERM;
        certbot certonly --webroot -w /var/www/certbot
        -d {{ '${' + cookiecutter.config_prefix + '__DOMAIN}' }}
        -d api.{{ '${' + cookiecutter.config_prefix + '__DOMAIN}' }}
        -d admin.{{ '${' + cookiecutter.config_prefix + '__DOMAIN}' }}
        -d auth.{{ '${' + cookiecutter.config_prefix + '__DOMAIN}' }}
        --email {{ '${' + cookiecutter.config_prefix + '__TLS__ACME_EMAIL}' }}
        --agree-tos --non-interactive --keep-until-expiring;
        while true; do certbot renew; sleep 12h; done;
{% endif %}
volumes:
  postgres_data:
{%- if cookiecutter.tls_termination == "self" %}
  letsencrypt:
  acme_webroot:
{%- endif %}

networks:
  internal:
    internal: true
  external:
    driver: bridge
