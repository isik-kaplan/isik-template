# Included into both of the server's plain-http blocks by the e2e stack alone (see
# docker-compose.e2e.yml): the same routes again over https, since a browser exposes no WebAuthn on
# plain http and the passkey specs cannot run without it. Self-signed - Playwright is told to accept it.
listen 443 ssl;
ssl_certificate /certs/cert.pem;
ssl_certificate_key /certs/key.pem;
