services:
  # Resolves {{ cookiecutter.domain }} and its subdomains inside the stack, without the host's /etc/hosts.
  dns:
    build:
      # Relative to the repo root, not this file's directory.
      context: ./e2e/dnsmasq
    # Here rather than in dnsmasq.conf so they follow E2E_SUBNET_PREFIX.
    command:
      - dnsmasq
      - -k
      - --log-facility=-
      - --address=/{{ cookiecutter.domain }}/${E2E_SUBNET_PREFIX:-172.30.0}.10
      - --address=/authentik.{{ cookiecutter.domain }}/${E2E_SUBNET_PREFIX:-172.30.0}.22
    networks:
      internal:
        ipv4_address: ${E2E_SUBNET_PREFIX:-172.30.0}.11
    restart: unless-stopped

  server:
    networks:
      internal:
        # Fixed: dnsmasq's address= directive needs a literal IP.
        ipv4_address: ${E2E_SUBNET_PREFIX:-172.30.0}.10
    # https beside http, so the passkey specs' pages are secure contexts.
    volumes:
      - ./e2e/nginx.tls.conf:/etc/nginx/extra-listen/tls.conf:ro
      - certs:/certs:ro
    depends_on:
      e2e-certs:
        condition: service_completed_successfully

  # One self-signed certificate for every name; the backend image already carries openssl.
  e2e-certs:
    image: ${COMPOSE_PROJECT_NAME:-{{ cookiecutter.repo_slug }}}-backend:latest
    volumes:
      - certs:/certs
    networks:
      - internal
    command:
      - sh
      - -c
      - >-
        openssl x509 -checkend 86400 -noout -in /certs/cert.pem 2>/dev/null
        || openssl req -x509 -newkey rsa:2048 -nodes -days 30
        -keyout /certs/key.pem -out /certs/cert.pem -subj "/CN={{ cookiecutter.domain }}"
        -addext "subjectAltName=DNS:{{ cookiecutter.domain }},DNS:*.{{ cookiecutter.domain }}"
        && chmod 644 /certs/key.pem /certs/cert.pem

  backend:
    dns:
      - ${E2E_SUBNET_PREFIX:-172.30.0}.11
    # Added to the base .env, not replacing it. "e2e/.env" because env_file resolves against the repo root.
    env_file: [e2e/.env]

{%- if cookiecutter.background_jobs != "inline" %}

  worker:
    env_file: [e2e/.env]
{%- endif %}
{%- if cookiecutter.background_jobs == "celery-with-beat" %}

  scheduler:
    env_file: [e2e/.env]
{%- endif %}

  frontend:
    dns:
      - ${E2E_SUBNET_PREFIX:-172.30.0}.11
    # Server-side fetches follow the page's scheme, so they meet the self-signed certificate too.
    environment:
      NODE_EXTRA_CA_CERTS: /certs/cert.pem
    volumes:
      - certs:/certs:ro
    depends_on:
      e2e-certs:
        condition: service_completed_successfully

  playwright:
    # Behind a profile so `up` never starts a second suite racing the one `run` starts on the same stack.
    profiles: [suite]
    build:
      context: ./e2e/playwright
    networks:
      - internal
    dns:
      - ${E2E_SUBNET_PREFIX:-172.30.0}.11
    # For the seeded superuser's credentials, which login-ladder.spec.ts uses.
    env_file: [.env]
    environment:
      # The same value the app's containers get.
      {{ cookiecutter.config_prefix }}__SOCIAL_LOGIN__PROVIDERS: {{ '${' + cookiecutter.config_prefix + '__SOCIAL_LOGIN__PROVIDERS:-}' }}
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ./e2e/playwright/playwright-report:/e2e/playwright-report
      - ./e2e/playwright/test-results:/e2e/test-results
      # What the legal specs check against.
      - ./{{ cookiecutter.project_slug }}-frontend/apps/web/src/legal:/legal:ro

volumes:
  certs:

networks:
  internal:
    ipam:
      config:
        - subnet: ${E2E_SUBNET_PREFIX:-172.30.0}.0/24
          # Dynamic addresses come from the top half, so none can take a fixed one before its owner starts.
          ip_range: ${E2E_SUBNET_PREFIX:-172.30.0}.128/25
