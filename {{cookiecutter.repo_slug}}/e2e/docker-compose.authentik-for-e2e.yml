# A real Authentik as the OIDC IdP, so the social-login spec drives a genuine round trip.
# Relative paths resolve against the repo root, the directory of the first COMPOSE_FILE entry.
services:
  authentik-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: authentik-e2e-only
    networks:
      # IPAM ignores a static IP until its service claims it, so it must sit outside the dynamic range.
      internal:
        ipv4_address: ${E2E_SUBNET_PREFIX:-172.30.0}.20
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "authentik"]
      interval: 5s
      timeout: 5s
      retries: 10

  authentik-redis:
    image: redis:7-alpine
    networks:
      internal:
        ipv4_address: ${E2E_SUBNET_PREFIX:-172.30.0}.21
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  authentik-server:
    image: ghcr.io/goauthentik/server:2026.2
    command: server
    environment: &authentik-environment
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik-e2e-only
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_SECRET_KEY: e2e-only-authentik-secret-key-not-a-real-secret
      # Skips the setup wizard; the blueprint does the real setup.
      AUTHENTIK_BOOTSTRAP_PASSWORD: e2e-only-akadmin-password
      AUTHENTIK_BOOTSTRAP_TOKEN: e2e-only-akadmin-token-not-a-real-secret
      AUTHENTIK_BOOTSTRAP_EMAIL: akadmin@example.com
    volumes:
      - ./e2e/authentik-blueprints:/blueprints/custom:ro
    networks:
      internal:
        ipv4_address: ${E2E_SUBNET_PREFIX:-172.30.0}.22
    depends_on:
      authentik-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
      # The worker applies the blueprint the healthcheck below waits on.
      authentik-worker:
        condition: service_started
    healthcheck:
      # Python, not curl: the amd64 image (every CI runner) has no curl or wget, though arm64 does.
      # Polls the test client's discovery document, not liveness, since the blueprint lands after startup.
      test:
        - CMD
        - /ak-root/.venv/bin/python3
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:9000/application/o/e2e-oidc-test/.well-known/openid-configuration',
          timeout=3)
      interval: 10s
      timeout: 5s
      retries: 60

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.2
    command: worker
    environment: *authentik-environment
    volumes:
      - ./e2e/authentik-blueprints:/blueprints/custom:ro
    networks:
      internal:
        ipv4_address: ${E2E_SUBNET_PREFIX:-172.30.0}.23
    depends_on:
      authentik-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy

  # The OIDC provider fetches the issuer's discovery document on first use.
  backend:
    depends_on:
      authentik-server:
        condition: service_healthy

  playwright:
    depends_on:
      authentik-server:
        condition: service_healthy
