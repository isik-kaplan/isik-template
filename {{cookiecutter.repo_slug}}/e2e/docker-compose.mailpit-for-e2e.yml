services:
  mailpit:
    image: axllent/mailpit:latest
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8025/api/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    depends_on:
      mailpit:
        condition: service_healthy

  playwright:
    depends_on:
      mailpit:
        condition: service_healthy
