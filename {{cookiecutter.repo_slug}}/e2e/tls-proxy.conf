# Stands in for the TLS-terminating load balancer an external-mode deployment runs in front of nginx (see
# docker-compose.tls-proxy-for-e2e.yml): nginx only ever sees http, and learns the scheme from the header alone.
server {
    listen 80;
    listen 443 ssl;
    ssl_certificate /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;

    location / {
        proxy_pass http://server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
