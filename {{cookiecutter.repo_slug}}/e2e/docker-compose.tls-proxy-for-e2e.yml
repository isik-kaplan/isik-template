# Puts a TLS-terminating proxy in front of the e2e stack, the shape of a real external-mode deployment, and points
# every name the browser uses at it. Layered on the e2e stack once it is up, from this directory:
#
#   COMPOSE_FILE="$(sed -n 's/^COMPOSE_FILE=//p' .env):docker-compose.tls-proxy-for-e2e.yml" docker compose up -d
#   docker compose run --rm -e E2E_BASE_URL=https://{{ cookiecutter.domain }} playwright \
#     npx playwright test auth/social-login.spec.ts
services:
  tls-proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./e2e/tls-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/certs:ro
    networks:
      internal:
        # Fixed for dnsmasq's answer below, and past the dynamic range like authentik's addresses.
        ipv4_address: ${E2E_SUBNET_PREFIX:-172.30.0}.24
    depends_on:
      server:
        condition: service_healthy

  dns:
    command:
      - dnsmasq
      - -k
      - --log-facility=-
      - --address=/{{ cookiecutter.domain }}/${E2E_SUBNET_PREFIX:-172.30.0}.24
      - --address=/authentik.{{ cookiecutter.domain }}/${E2E_SUBNET_PREFIX:-172.30.0}.22
