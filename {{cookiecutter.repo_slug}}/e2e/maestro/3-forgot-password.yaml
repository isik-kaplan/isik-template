appId: {{ cookiecutter.domain.split(".") | reverse | join(".") }}.mobile
name: Asking for a reset link says one is on its way, whoever asks
---
- runFlow: common/start.yaml
- tapOn:
    id: forgot-password-link
- tapOn:
    id: email-input
- inputText: ${SUPERUSER_EMAIL}
# Return leaves a one-line field, closing the keyboard over the button; hideKeyboard fails on iOS.
- pressKey: Enter
- tapOn:
    id: forgot-password-submit
- extendedWaitUntil:
    visible:
      id: forgot-password-sent-message
    timeout: 15000
