# Applied by Authentik on boot. Schema checked against the 2026.2 image's /blueprints/schema.json.
version: 1
metadata:
  name: E2E test OIDC IdP
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: e2e-oidc-provider
    identifiers:
      name: e2e-oidc-provider
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: e2e-oidc-client-id
      client_secret: e2e-oidc-client-secret-not-a-real-secret
      # "authentik" must match {{ cookiecutter.config_prefix }}__OAUTH__OPENID_CONNECT__PROVIDER_ID in e2e/.env.
      redirect_uris:
        - matching_mode: strict
          url: http://auth.{{ cookiecutter.domain }}/v0/provider-callback/oidc/authentik/login/callback/
        # The same callback through the tls-proxy overlay.
        - matching_mode: strict
          url: https://auth.{{ cookiecutter.domain }}/v0/provider-callback/oidc/authentik/login/callback/
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      # Without these only "sub" comes back, and with no email the login silently fails.
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-email"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]

  - model: authentik_core.application
    identifiers:
      slug: e2e-oidc-test
    attrs:
      name: E2E OIDC Test
      provider: !KeyOf e2e-oidc-provider

  # One identity per spec: a shared one signs the second spec into the first spec's account.
  - model: authentik_core.user
    identifiers:
      username: oidc-e2e-user
    attrs:
      name: OIDC E2E User
      email: oidc-e2e-user@example.com
      is_active: true
      password: correct-horse-battery-staple
      type: internal

  - model: authentik_core.user
    identifiers:
      username: oidc-e2e-user-2
    attrs:
      name: OIDC E2E User 2
      email: oidc-e2e-user-2@example.com
      is_active: true
      password: correct-horse-battery-staple
      type: internal

  # profile/reauthentication-social.spec.ts's.
  - model: authentik_core.user
    identifiers:
      username: oidc-e2e-user-3
    attrs:
      name: OIDC E2E User 3
      email: oidc-e2e-user-3@example.com
      is_active: true
      password: correct-horse-battery-staple
      type: internal

  # auth/login-ladder.spec.ts's: turned away, so it must never be used to create an account.
  - model: authentik_core.user
    identifiers:
      username: oidc-e2e-user-4
    attrs:
      name: OIDC E2E User 4
      email: oidc-e2e-user-4@example.com
      is_active: true
      password: correct-horse-battery-staple
      type: internal
