# Forward anything not matched below to Docker's own embedded resolver (always 127.0.0.11) - not
# a public DNS - so container-name lookups (backend, frontend, mailpit, ...) still work for any
# container whose `dns:` is pointed at this service.
no-resolv
server=127.0.0.11

# {{ cookiecutter.domain }} and every subdomain (api., admin., auth.) resolve straight to the
# server (nginx) container's fixed e2e-only IP - see docker-compose.e2e.yml.
address=/{{ cookiecutter.domain }}/172.30.0.10

# authentik.{{ cookiecutter.domain }} - the e2e-only test IdP (see
# docker-compose.authentik-for-e2e.yml) - more specific than the wildcard above, so dnsmasq
# answers this one subdomain with the real Authentik container instead of falling through to it.
address=/authentik.{{ cookiecutter.domain }}/172.30.0.22
