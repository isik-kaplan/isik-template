# Forward anything not matched below to Docker's own embedded resolver (always 127.0.0.11) - not
# a public DNS - so container-name lookups (backend, frontend, mailpit, ...) still work for any
# container whose `dns:` is pointed at this service.
no-resolv
server=127.0.0.11

# {{ cookiecutter.domain }} and every subdomain (api., admin., auth.) resolve straight to the
# server (nginx) container's fixed e2e-only IP, and authentik.{{ cookiecutter.domain }} - more specific,
# so it wins - to the test IdP's. Both are passed on the command line in docker-compose.e2e.yml, which
# knows the subnet.
