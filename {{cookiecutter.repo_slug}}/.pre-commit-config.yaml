repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        # Authentik's !Find/!KeyOf tags; excluded rather than --unsafe, which would weaken every other file.
        exclude: ^e2e/authentik-blueprints/
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # None takes paths: `files` only decides whether a hook runs.
  - repo: local
    hooks:
      - id: migration-check
        name: migration-check
        entry: scripts/pre-commit/migration_check.sh
        language: script
        pass_filenames: false
        files: ^{{ cookiecutter.project_slug }}/.*\.py$

      - id: openapi-check
        name: openapi-check
        entry: scripts/pre-commit/openapi_check.sh
        language: script
        pass_filenames: false
        files: ^{{ cookiecutter.project_slug }}(/.*\.py|-frontend/packages/(api|auth-api)/.*)$

      - id: layout-check
        name: layout-check
        entry: python {{ cookiecutter.project_slug }}/scripts/layout_check.py
        language: python
        pass_filenames: false
        files: ^{{ cookiecutter.project_slug }}/.*\.py$

      # TERMS_VERSION is what a signup records, so it must not lag the documents.
      - id: legal-version
        name: legal-version
        entry: python scripts/pre-commit/legal_version.py
        language: python
        pass_filenames: false
        files: ^({{ cookiecutter.project_slug }}-frontend/apps/web/src/legal/|{{ cookiecutter.project_slug }}/apps/users/terms\.py$)

      - id: lint-frontend
        name: lint-frontend
        entry: scripts/pre-commit/lint_frontend.sh
        language: script
        pass_filenames: false
        files: ^{{ cookiecutter.project_slug }}-frontend/.*\.(ts|tsx|js|jsx|mjs|css|json|md)$
