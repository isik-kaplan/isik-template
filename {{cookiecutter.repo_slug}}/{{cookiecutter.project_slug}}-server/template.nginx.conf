worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20M;
    # Room for the frontend's key as a map key ($client_ip below): setup.sh's is 64 characters, past
    # the default bucket. Before the first map, which fixes the size otherwise.
    map_hash_bucket_size 256;

    log_format main '$remote_addr - $host [$time_local] "$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" "$http_x_forwarded_for" '
                     'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    # '' (empty), not "close" - this map also runs for every ordinary, non-websocket request
    # (nearly all traffic), and "close" there sends "Connection: close" upstream on each one,
    # silently defeating the upstream keepalive pools below regardless of their own settings. An
    # empty value makes nginx omit the header entirely, which is what lets HTTP/1.1 keep-alive
    # apply by default.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # backend-internal/frontend-internal, not the bare "backend"/"frontend" service names - both
    # of those containers sit on two networks, and the bare name would resolve to whichever
    # address answered first rather than reliably this network's. A named upstream (not a
    # variable proxy_pass, which cannot use its keepalive cache and re-resolves + reconnects on
    # every single request) resolves these once at nginx startup and pools real connections
    # across requests - the whole point, since uwsgi's own HTTP router only keeps a connection
    # alive when told to (see uwsgi.ini). The tradeoff of that one-time resolution: rebuilding
    # backend/frontend alone (`docker compose up -d --build backend`) changes which address
    # answers to that alias, and this upstream keeps pointing at the old one until nginx itself
    # is restarted too - `docker compose restart server` after any backend/frontend rebuild, or
    # rebuild the whole stack together.
    upstream backend_api {
        server backend-internal:80;
        keepalive 16;
        # Shorter than uwsgi's own http-timeout (60s default, unchanged) so nginx always closes
        # this leg first - two peers racing an identical idle window is what produces "other side
        # closed" in the first place.
        keepalive_timeout 30s;
    }

    upstream frontend_app {
        server frontend-internal:80;
        keepalive 16;
        # Shorter than the frontend container's own KEEP_ALIVE_TIMEOUT (65s, see docker-compose.yml)
        # for the same reason as backend_api above.
        keepalive_timeout 30s;
    }

    # Who a request is from, worked out once, here. The backend counts its rate limits against it and
    # writes it on its log lines (X-Client-Ip below, apps/common/client_ip.py), and limit_req counts
    # against it too.
    #
    # TRUSTED_PROXY_COUNT proxies, nginx among them, append to X-Forwarded-For, so the client is the entry
    # one fewer than that from the right of the header as it reaches nginx; entrypoint.sh writes the
    # pattern for the count. A header with fewer entries came from something that skipped the proxies -
    # the frontend's own fetches, say, which reach nginx over the internal network - and its own address
    # is the answer.
    map $http_x_forwarded_for $forwarded_client {
        "${NGINX_FORWARDED_CLIENT_PATTERN}" $forwarded;
        default $remote_addr;
    }

    # ...except a fetch the frontend makes while rendering a page, which is for the visitor it renders for,
    # not for the frontend: it names them in X-Visitor-Ip, proving it is the frontend with the key the two
    # share. entrypoint.sh refuses to start without one, since an empty key would match a request that
    # sent none.
    map $http_x_frontend_key $client_ip {
        "${{ '{' + cookiecutter.config_prefix }}__FRONTEND_KEY}" $http_x_visitor_ip;
        default $forwarded_client;
    }

    # A flood guard in front of the backend's own, finer limits (allauth's and the API's): generous, and
    # per client. RATE_LIMITS__* set it, through entrypoint.sh. The frontend's own fetches are not counted
    # (an empty key never is): the page that made them already was, and a page refused halfway through
    # rendering would read as signed out or empty.
    map $http_x_frontend_key $limited_client {
        "${{ '{' + cookiecutter.config_prefix }}__FRONTEND_KEY}" "";
        default $forwarded_client;
    }
    limit_req_zone $limited_client zone=clients:10m rate=${NGINX_REQUESTS_PER_SECOND}r/s;
    limit_req_status 429;

    # The frontend's own origin, the one browsers call the API from - so a refusal nginx writes itself
    # still carries the CORS headers that let the page read it.
    map $http_origin $frontend_origin {
        "http://${{ '{' + cookiecutter.config_prefix }}__DOMAIN}" $http_origin;
        "https://${{ '{' + cookiecutter.config_prefix }}__DOMAIN}" $http_origin;
        default "";
    }

{%- set domain = '${' + cookiecutter.config_prefix + '__DOMAIN}' %}
{%- set file_locations %}
        # Stored files, sent once a backend view has decided who may have one (apps/common/files.py):
        # its response is only an X-Accel-Redirect to here. `internal` keeps this unreachable any other
        # way. The two headers keep an uploaded HTML or SVG file from running as a page on this origin.
{%- if cookiecutter.storage == "disk" %}
        location /internal/media/ {
            internal;
            alias /media/;
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        }
{%- else %}
        # The file comes from the bucket over the presigned URL the view put in X-Storage-Url, and the
        # bucket's own answer (type, length, ranges) goes to the client - but for the disposition,
        # which is the view's. Docker's DNS, re-asked every 30s, because the storage service's address
        # changes whenever its container does.
        location = /internal/storage/ {
            internal;
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $storage_url $upstream_http_x_storage_url;
            proxy_pass $storage_url;
            proxy_ssl_server_name on;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # Nothing of the client's goes to the bucket: the URL's signature is the whole credential.
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_hide_header Set-Cookie;
            proxy_hide_header Content-Disposition;
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        }
{%- endif %}
{%- endset %}
{%- set proto = '$scheme' if cookiecutter.tls_termination == "self" else '$forwarded_proto' %}
{%- set who_it_is_for %}
            # nginx's answer, over whatever the client sent; the frontend's key and its visitor's address
            # are nginx's alone to read.
            proxy_set_header X-Client-Ip $client_ip;
            proxy_set_header X-Frontend-Key "";
            proxy_set_header X-Visitor-Ip "";
{%- endset %}
{%- set frontend_proxy %}
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            # Set, never passed on from the client: the frontend builds its server-side fetch URLs from it.
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto {{ proto }};
{{- who_it_is_for }}
            # Next.js's own self-hosting guidance: streaming SSR responses need buffering off.
            proxy_buffering off;
{%- endset %}
{%- set frontend_locations %}
        # A page, as a person waits for it to load: answered in a page.
        error_page 429 @rate_limited;
        location @rate_limited {
            default_type text/html;
            add_header Retry-After 1 always;
            return 429 '<!doctype html><meta charset="utf-8"><title>Too many requests</title><p>Too many requests. Wait a moment, then reload the page.</p>';
        }

        # Built once, named by their content, and dozens to a page: no flood to guard against.
        location /_next/static/ {
{{- frontend_proxy }}
        }

        location / {
            ${NGINX_LIMIT_REQ}
{{- frontend_proxy }}
        }
{%- endset %}
{%- set backend_locations %}
        # In the shape the API's own throttles answer in (detail and code), and readable from the page:
        # without the CORS headers a browser reports a refused cross-origin fetch as the network failing.
        # One second, as that is how soon the bucket has room again.
        error_page 429 @rate_limited;
        location @rate_limited {
            default_type application/json;
            add_header Retry-After 1 always;
            add_header Access-Control-Allow-Origin $frontend_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Vary Origin always;
            return 429 '{"detail": "Too many requests.", "code": "throttled"}';
        }

{{ file_locations }}

        location / {
            ${NGINX_LIMIT_REQ}
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
{%- if cookiecutter.tls_termination == "self" %}
            # $scheme, never a client-supplied X-Forwarded-Proto - allauth builds every emailed
            # link (verification, password reset) from this, so a client-controlled value would
            # let anyone choose the scheme of a link mailed to someone else.
{%- else %}
            # The load balancer's value, never one a client reached nginx with directly - allauth builds
            # every emailed link and OAuth redirect_uri from this.
{%- endif %}
            proxy_set_header X-Forwarded-Proto {{ proto }};
{{- who_it_is_for }}
        }
{%- endset %}

    # Any Host the blocks below don't name, a scanner's or one forged to steer the frontend's server-side
    # fetches, is dropped unanswered. /health still answers the probes that address this container by IP.
    server {
        listen 80 default_server;

        location /health {
            access_log off;
            return 200 "ok";
        }

        location / {
            return 444;
        }
    }
{% if cookiecutter.tls_termination == "self" %}
    server {
        listen 443 ssl default_server;
        ssl_reject_handshake on;
    }

    # Plain http only answers certbot's HTTP-01 challenge and redirects everything else to https -
    # see docker-compose.yml's certbot service. nginx itself still starts cleanly before any real
    # certificate exists, off a throwaway self-signed one certificate.sh writes first - the
    # alternative, refusing to start a :443 server block with no certificate on disk yet, would
    # make this a chicken-and-egg problem on every first boot.
    server {
        listen 80;
        server_name {{ domain }} api.{{ domain }} admin.{{ domain }} auth.{{ domain }};

        location /health {
            access_log off;
            return 200 "ok";
        }

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name {{ domain }};

        ssl_certificate /etc/nginx/certificate/fullchain.pem;
        ssl_certificate_key /etc/nginx/certificate/privkey.pem;

        location /health {
            access_log off;
            return 200 "ok";
        }

        # Only here: Django sends it for api./admin./auth., which includeSubDomains covers anyway.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

{{ frontend_locations }}
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name api.{{ domain }} admin.{{ domain }} auth.{{ domain }};

        # Same certificate as the block above - one covering all four names (see docker-compose.yml's
        # certbot service), not one per subdomain.
        ssl_certificate /etc/nginx/certificate/fullchain.pem;
        ssl_certificate_key /etc/nginx/certificate/privkey.pem;

        client_max_body_size 20M;

        location /health {
            access_log off;
            return 200 "ok";
        }

{{ backend_locations }}
    }
{% else %}
    # The load balancer in front terminates TLS, so this nginx only ever speaks http and $scheme would always
    # say so. Its port must reach only that load balancer (loopback, or HTTP_BIND firewalled to it), or a
    # client could set this header itself.
    map $http_x_forwarded_proto $forwarded_proto {
        ""      $scheme;
        default $http_x_forwarded_proto;
    }

    server {
        listen 80;
        server_name {{ domain }};
        # Empty on a real deployment. An https listener snippet lands here locally - scripts/dev-tls.sh's, or
        # the e2e stack's, since passkeys only exist in a secure context.
        include /etc/nginx/extra-listen/*.conf;

        location /health {
            access_log off;
            return 200 "ok";
        }

{{ frontend_locations }}
    }

    server {
        listen 80;
        server_name api.{{ domain }} admin.{{ domain }} auth.{{ domain }};
        include /etc/nginx/extra-listen/*.conf;

        client_max_body_size 20M;

        location /health {
            access_log off;
            return 200 "ok";
        }

{{ backend_locations }}
    }
{% endif %}
}
