worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    log_format main '$remote_addr - $host [$time_local] "$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" "$http_x_forwarded_for" '
                     'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    # '' (empty), not "close" - this map also runs for every ordinary, non-websocket request
    # (nearly all traffic), and "close" there sends "Connection: close" upstream on each one,
    # silently defeating the upstream keepalive pools below regardless of their own settings. An
    # empty value makes nginx omit the header entirely, which is what lets HTTP/1.1 keep-alive
    # apply by default.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # backend-internal/frontend-internal, not the bare "backend"/"frontend" service names - both
    # of those containers sit on two networks, and the bare name would resolve to whichever
    # address answered first rather than reliably this network's. A named upstream (not a
    # variable proxy_pass, which cannot use its keepalive cache and re-resolves + reconnects on
    # every single request) resolves these once at nginx startup and pools real connections
    # across requests - the whole point, since uwsgi's own HTTP router only keeps a connection
    # alive when told to (see uwsgi.ini). The tradeoff of that one-time resolution: rebuilding
    # backend/frontend alone (`docker compose up -d --build backend`) changes which address
    # answers to that alias, and this upstream keeps pointing at the old one until nginx itself
    # is restarted too - `docker compose restart server` after any backend/frontend rebuild, or
    # rebuild the whole stack together.
    upstream backend_api {
        server backend-internal:80;
        keepalive 16;
        # Shorter than uwsgi's own http-timeout (60s default, unchanged) so nginx always closes
        # this leg first - two peers racing an identical idle window is what produces "other side
        # closed" in the first place.
        keepalive_timeout 30s;
    }

    upstream frontend_app {
        server frontend-internal:80;
        keepalive 16;
        # Shorter than the frontend container's own KEEP_ALIVE_TIMEOUT (65s, see docker-compose.yml)
        # for the same reason as backend_api above.
        keepalive_timeout 30s;
    }

{%- set domain = '${' + cookiecutter.config_prefix + '__DOMAIN}' %}

    # Any Host the blocks below don't name, a scanner's or one forged to steer the frontend's server-side
    # fetches, is dropped unanswered. /health still answers the probes that address this container by IP.
    server {
        listen 80 default_server;

        location /health {
            access_log off;
            return 200 "ok";
        }

        location / {
            return 444;
        }
    }
{% if cookiecutter.tls_termination == "self" %}
    server {
        listen 443 ssl default_server;
        ssl_reject_handshake on;
    }

    # Plain http only answers certbot's HTTP-01 challenge and redirects everything else to https -
    # see docker-compose.yml's certbot service. nginx itself still starts cleanly before any real
    # certificate exists, off a throwaway self-signed one certificate.sh writes first - the
    # alternative, refusing to start a :443 server block with no certificate on disk yet, would
    # make this a chicken-and-egg problem on every first boot.
    server {
        listen 80;
        server_name {{ domain }} api.{{ domain }} admin.{{ domain }} auth.{{ domain }};

        location /health {
            access_log off;
            return 200 "ok";
        }

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name {{ domain }};

        ssl_certificate /etc/nginx/certificate/fullchain.pem;
        ssl_certificate_key /etc/nginx/certificate/privkey.pem;

        location /health {
            access_log off;
            return 200 "ok";
        }

        # Only here: Django sends it for api./admin./auth., which includeSubDomains covers anyway.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            # Set, never passed on from the client: the frontend builds its server-side fetch URLs from it.
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Next.js's own self-hosting guidance: streaming SSR responses need buffering off.
            proxy_buffering off;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name api.{{ domain }} admin.{{ domain }} auth.{{ domain }};

        # Same certificate as the block above - one covering all four names (see docker-compose.yml's
        # certbot service), not one per subdomain.
        ssl_certificate /etc/nginx/certificate/fullchain.pem;
        ssl_certificate_key /etc/nginx/certificate/privkey.pem;

        client_max_body_size 20M;

        location /health {
            access_log off;
            return 200 "ok";
        }

        location / {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # $scheme, never a client-supplied X-Forwarded-Proto - allauth builds every emailed
            # link (verification, password reset) from this, so a client-controlled value would
            # let anyone choose the scheme of a link mailed to someone else.
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
{% else %}
    # The load balancer in front terminates TLS, so this nginx only ever speaks http and $scheme would always
    # say so. Its port must reach only that load balancer (loopback, or HTTP_BIND firewalled to it), or a
    # client could set this header itself.
    map $http_x_forwarded_proto $forwarded_proto {
        ""      $scheme;
        default $http_x_forwarded_proto;
    }

    server {
        listen 80;
        server_name {{ domain }};
        # Empty on a real deployment. An https listener snippet lands here locally - scripts/dev-tls.sh's, or
        # the e2e stack's, since passkeys only exist in a secure context.
        include /etc/nginx/extra-listen/*.conf;

        location /health {
            access_log off;
            return 200 "ok";
        }

        location / {
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            # Set, never passed on from the client: the frontend builds its server-side fetch URLs from it.
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            # Next.js's own self-hosting guidance: streaming SSR responses need buffering off.
            proxy_buffering off;
        }
    }

    server {
        listen 80;
        server_name api.{{ domain }} admin.{{ domain }} auth.{{ domain }};
        include /etc/nginx/extra-listen/*.conf;

        client_max_body_size 20M;

        location /health {
            access_log off;
            return 200 "ok";
        }

        location / {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # The load balancer's value, never one a client reached nginx with directly - allauth builds
            # every emailed link and OAuth redirect_uri from this.
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }
    }
{% endif %}
}
