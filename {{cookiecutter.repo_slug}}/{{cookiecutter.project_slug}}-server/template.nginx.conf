worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20M;
    # Fits the 64-character frontend key as a map key; must precede the first map.
    map_hash_bucket_size 256;

    log_format main '$remote_addr - $host [$time_local] "$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" "$http_x_forwarded_for" '
                     'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    # '' rather than "close", which would send "Connection: close" on every ordinary request and
    # defeat the upstream keepalive pools.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # The -internal aliases: on two networks the bare service name may resolve to either. A named
    # upstream pools connections but resolves once, so restart `server` after rebuilding backend or frontend.
    upstream backend_api {
        server backend-internal:80;
        keepalive 16;
        # Shorter than uwsgi's 60s http-timeout, so nginx always closes an idle connection first.
        keepalive_timeout 30s;
    }

    upstream frontend_app {
        server frontend-internal:80;
        keepalive 16;
        # Shorter than the frontend's KEEP_ALIVE_TIMEOUT, for the same reason.
        keepalive_timeout 30s;
    }

    # The client, worked out once here for the backend (X-Client-Ip) and limit_req. entrypoint.sh writes
    # the pattern; a header with fewer entries skipped the proxies, so its own address is the answer.
    map $http_x_forwarded_for $forwarded_client {
        "${NGINX_FORWARDED_CLIENT_PATTERN}" $forwarded;
        default $remote_addr;
    }

    # A fetch carrying the frontend's key is for the visitor it names in X-Visitor-Ip.
    map $http_x_frontend_key $client_ip {
        "${{ '{' + cookiecutter.config_prefix }}__FRONTEND_KEY}" $http_x_visitor_ip;
        default $forwarded_client;
    }

    # A per-client flood guard. The frontend's own fetches are not counted (an empty key never is): the
    # page was, and a page refused halfway through rendering would read as signed out or empty.
    map $http_x_frontend_key $limited_client {
        "${{ '{' + cookiecutter.config_prefix }}__FRONTEND_KEY}" "";
        default $forwarded_client;
    }
    limit_req_zone $limited_client zone=clients:10m rate=${NGINX_REQUESTS_PER_SECOND}r/s;
    limit_req_status 429;

    # So a 429 nginx writes itself still carries CORS headers the page can read.
    map $http_origin $frontend_origin {
        "http://${{ '{' + cookiecutter.config_prefix }}__DOMAIN}" $http_origin;
        "https://${{ '{' + cookiecutter.config_prefix }}__DOMAIN}" $http_origin;
        default "";
    }

{%- set domain = '${' + cookiecutter.config_prefix + '__DOMAIN}' %}
{%- set file_locations %}
        # Reached only by a backend view's X-Accel-Redirect. The two headers keep an uploaded HTML or SVG
        # file from running as a page on this origin.
{%- if cookiecutter.storage == "disk" %}
        location /internal/media/ {
            internal;
            alias /media/;
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        }
{%- else %}
        # Fetched from the presigned URL in X-Storage-Url; the disposition stays the view's. Docker's DNS
        # is re-asked every 30s because the storage container's address can change.
        location = /internal/storage/ {
            internal;
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $storage_url $upstream_http_x_storage_url;
            proxy_pass $storage_url;
            proxy_ssl_server_name on;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # The URL's signature is the whole credential; nothing of the client's goes to the bucket.
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_hide_header Set-Cookie;
            proxy_hide_header Content-Disposition;
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        }
{%- endif %}
{%- endset %}
{%- set proto = '$scheme' if cookiecutter.tls_termination == "self" else '$forwarded_proto' %}
{%- set who_it_is_for %}
            # Overrides whatever the client sent; the key and visitor address are nginx's alone.
            proxy_set_header X-Client-Ip $client_ip;
            proxy_set_header X-Frontend-Key "";
            proxy_set_header X-Visitor-Ip "";
{%- endset %}
{%- set frontend_proxy %}
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            # Never the client's: the frontend builds its server-side fetch URLs from it.
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto {{ proto }};
{{- who_it_is_for }}
            # Streaming SSR needs buffering off.
            proxy_buffering off;
{%- endset %}
{%- set frontend_locations %}
        error_page 429 @rate_limited;
        location @rate_limited {
            default_type text/html;
            add_header Retry-After 1 always;
            return 429 '<!doctype html><meta charset="utf-8"><title>Too many requests</title><p>Too many requests. Wait a moment, then reload the page.</p>';
        }

        # Content-hashed and dozens to a page, so not rate-limited.
        location /_next/static/ {
{{- frontend_proxy }}
        }

        location / {
            ${NGINX_LIMIT_REQ}
{{- frontend_proxy }}
        }
{%- endset %}
{%- set backend_locations %}
        # Shaped like the API's throttles. Without CORS headers a browser reports it as a network failure.
        error_page 429 @rate_limited;
        location @rate_limited {
            default_type application/json;
            add_header Retry-After 1 always;
            add_header Access-Control-Allow-Origin $frontend_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Vary Origin always;
            return 429 '{"detail": "Too many requests.", "code": "throttled"}';
        }

{{ file_locations }}

        location / {
            ${NGINX_LIMIT_REQ}
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
{%- if cookiecutter.tls_termination == "self" %}
            # Never the client's: allauth builds every emailed link from it.
{%- else %}
            # The load balancer's value: allauth builds every emailed link and OAuth redirect_uri from it.
{%- endif %}
            proxy_set_header X-Forwarded-Proto {{ proto }};
{{- who_it_is_for }}
        }
{%- endset %}

    # Unknown Hosts are dropped, so none can steer the frontend's server-side fetches. /health serves probes by IP.
    server {
        listen 80 default_server;

        location /health {
            access_log off;
            return 200 "ok";
        }

        location / {
            return 444;
        }
    }
{% if cookiecutter.tls_termination == "self" %}
    server {
        listen 443 ssl default_server;
        ssl_reject_handshake on;
    }

    # Plain http only answers certbot's challenge and redirects the rest to https.
    server {
        listen 80;
        server_name {{ domain }} api.{{ domain }} admin.{{ domain }} auth.{{ domain }};

        location /health {
            access_log off;
            return 200 "ok";
        }

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name {{ domain }};

        ssl_certificate /etc/nginx/certificate/fullchain.pem;
        ssl_certificate_key /etc/nginx/certificate/privkey.pem;

        location /health {
            access_log off;
            return 200 "ok";
        }

        # Only here: Django sends it for api./admin./auth., which includeSubDomains covers anyway.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

{{ frontend_locations }}
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name api.{{ domain }} admin.{{ domain }} auth.{{ domain }};

        # One certificate covers all four names.
        ssl_certificate /etc/nginx/certificate/fullchain.pem;
        ssl_certificate_key /etc/nginx/certificate/privkey.pem;

        client_max_body_size 20M;

        location /health {
            access_log off;
            return 200 "ok";
        }

{{ backend_locations }}
    }
{% else %}
    # $scheme is always http behind the load balancer. Only it may reach this port, or a client sets the header.
    map $http_x_forwarded_proto $forwarded_proto {
        ""      $scheme;
        default $http_x_forwarded_proto;
    }

    server {
        listen 80;
        server_name {{ domain }};
        # Empty when deployed; local https (scripts/dev-tls.sh, e2e) puts a listen snippet here.
        include /etc/nginx/extra-listen/*.conf;

        location /health {
            access_log off;
            return 200 "ok";
        }

{{ frontend_locations }}
    }

    server {
        listen 80;
        server_name api.{{ domain }} admin.{{ domain }} auth.{{ domain }};
        include /etc/nginx/extra-listen/*.conf;

        client_max_body_size 20M;

        location /health {
            access_log off;
            return 200 "ok";
        }

{{ backend_locations }}
    }
{% endif %}
}
