# kombu declares transient non-exclusive pidbox queues, which RabbitMQ 4 rejects by default.
# Remove once kombu ships celery/kombu#2237.
deprecated_features.permit.transient_nonexcl_queues = true

# Celery's prefetch relies on global QoS, which RabbitMQ 4 also disallows by default.
deprecated_features.permit.global_qos = true
