# kombu (Celery's AMQP transport) declares its pidbox/control queues as transient and
# non-exclusive, a combination RabbitMQ 4.0+ deprecated and rejects by default (INTERNAL_ERROR on
# Queue.declare). The real fix lives in kombu (celery/kombu#2237), not released yet - this is the
# officially documented bridge setting until it ships. Remove once the installed kombu version no
# longer needs it.
deprecated_features.permit.transient_nonexcl_queues = true

# Celery's default prefetch behavior relies on global (per-channel, not per-consumer) QoS, which
# RabbitMQ 4.x also disallows by default. Same situation as above - a kombu/celery-side fix would
# obsolete this, not released yet as of celery 5.6.
deprecated_features.permit.global_qos = true
