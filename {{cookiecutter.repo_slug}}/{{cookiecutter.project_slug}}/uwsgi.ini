[uwsgi]
module = {{ cookiecutter.project_slug }}.wsgi:application
master = true
processes = 4
; uWSGI 2.0 reads SIGTERM as "reload", so `docker stop` re-executed the server instead of stopping it.
die-on-term = true
harakiri = 30
http = :80
; Otherwise uwsgi closes without "Connection: close" and nginx's pooled socket gets ECONNRESET.
; A flag, not a duration: http-timeout (60s) must outlast nginx's keepalive_timeout.
http-keepalive = 1
; No http-auto-chunked: it writes a terminating chunk after a 304, stalling nginx's next request.
threads = 2
vacuum = true
{%- if cookiecutter.background_jobs != "celery-with-beat" %}
; No beat here: once a minute, what one would run - fan-out, retries due, pruning. unique: never two at once.
cron2 = minute=-1,unique=1 python manage.py notices --work
{%- endif %}
