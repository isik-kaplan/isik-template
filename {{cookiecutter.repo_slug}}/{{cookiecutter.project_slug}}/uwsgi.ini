[uwsgi]
module = {{ cookiecutter.project_slug }}.wsgi:application
master = true
processes = 4
; A plain http://<subdomain>.<domain>/ request (no explicit port) implies 80 - serving there
; directly means nginx's proxy_pass needs no port-rewriting workaround.
http = :80
; uwsgi's HTTP router doesn't keep a connection alive unless told to, and - the actual trap -
; closes it without ever sending "Connection: close". nginx's upstream keepalive (see
; server/template.nginx.conf) has no way to know the socket it just pooled is already dead, and
; the next request written to it gets ECONNRESET. http-keepalive is a flag (1 = on), not a
; duration - the idle window is http-timeout, left at its 60s default, which must stay longer
; than nginx's own keepalive_timeout to this upstream so nginx always closes first.
http-keepalive = 1
; Required for keep-alive to do anything at all: a kept-alive connection needs response framing,
; and a response with no Content-Length (any streaming one) has none without chunked encoding.
http-auto-chunked = true
workers = 4
threads = 2
vacuum = true
