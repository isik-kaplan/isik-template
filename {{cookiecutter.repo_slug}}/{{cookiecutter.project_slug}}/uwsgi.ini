[uwsgi]
module = {{ cookiecutter.project_slug }}.wsgi:application
master = true
processes = 4
; uWSGI 2.0 reads SIGTERM as "reload", so `docker stop` re-executed the server instead of stopping it.
die-on-term = true
harakiri = 30
http = :80
; Otherwise uwsgi closes without "Connection: close" and nginx's pooled socket gets ECONNRESET.
; A flag, not a duration: http-timeout (60s) must outlast nginx's keepalive_timeout.
http-keepalive = 1
; No http-auto-chunked: it writes a terminating chunk after a 204 or 304, stalling nginx's next request.
threads = 2
vacuum = true
{%- if cookiecutter.background_jobs != "celery-with-beat" %}
; No beat here: once a minute, what one would run - fan-out, retries due, pruning, and features starting or
; ending. unique: never two at once.
cron2 = minute=-1,unique=1 python manage.py notices --work
cron2 = minute=-1,unique=1 python manage.py features --sweep
; Daily housekeeping: the token tables stay correct however large they grow.
cron2 = hour=4,minute=30,unique=1 python manage.py clear_expired_tokens
; And an address held by a signup that never proved it, released a day after its link expired.
cron2 = hour=4,minute=45,unique=1 python manage.py remove_unverified_accounts
; Hourly: an account whose grace period ended is deleted, by ACCOUNTS__DELETION's backend.
cron2 = minute=15,unique=1 python manage.py delete_due_accounts
{%- endif %}
