# Whole functions mutmut's own tracing cannot attribute to any test, so every mutant of each comes
# back "no tests" however well the suite covers it. Keyed by function, so an entry covers every mutant
# of that function, including ones added later - which is exactly why nothing else belongs here.
#
# "no tests" is mutmut's trampoline reporting zero test attribution, which is not the same claim as
# "no test calls it" - checked by hand each time before an entry is added, by breaking the function
# and watching a named test fail.
#
# A single mutant no test can kill (an equivalent mutant) belongs in mutation-equivalents.toml, keyed
# by the mutation itself - scripts/confirm_survivors.py refuses a mutant name here.
#
# scripts/check_mutants.py and scripts/confirm_survivors.py enforce this file in CI, and every entry
# is re-run on every push by the mutation job's re-check step.

["{{ cookiecutter.project_slug }}.settings.x__origins"]
reason = """Genuinely covered, not equivalent: tests/test_settings.py calls this function directly for
both branches (DEBUG answers http and https, a deployment https only) and checks CSRF_TRUSTED_ORIGINS
and CORS_ALLOWED_ORIGINS against it. Manually breaking it (misspelling the "https" scheme, or answering
None outside DEBUG) makes those tests fail, confirmed by hand.

mutmut's own trampoline never attributes any hit here to a test, though: its only call sites run once
during Django's settings import (django.setup(), inside pytest-django's pytest_configure hook), before
mutmut's per-test attribution has anywhere to attach a hit, and the mutmut version pinned here (3.7.x)
still reports "no tests" when a test calls it again - a tooling limitation with Django settings modules,
not a real coverage gap. Revisit if a mutmut upgrade changes this."""

