# Single mutants no test can kill, because the system behaves identically with them. Each is skipped
# by phase one and subtracted from the survivor list in phase two.
#
# The bar is behavior. A test that asserts what a call returned, what it wrote or what a user sees
# kills a mutant; asserting the arguments a mock received does not, and neither does reading a
# spelling back out of a header. An escape hatch from a policy, so it is guarded like one:
#
#   * every entry needs a `reason` long enough to be one, or scripts/confirm_survivors.py rejects the
#     file.
#   * an entry whose mutant is now killed fails the build - an unnecessary exemption is how a list
#     like this becomes a way of ignoring the policy. `python -m scripts.toolbox.check_exemption_keys`
#     (run by CI) finds one whose mutant no longer exists at all.
#   * an entry may name a test with `verified_by`, and then that test re-checks it instead of the
#     re-run. Only for a reason that rests on a library's behavior rather than this codebase's own -
#     a case-insensitive header, an argument a library method never reads - and the test must make
#     the real call the reason is about, not a stand-in that looks similar. The re-run it replaces can
#     only ever observe "nothing killed it"; the test asserts the reason itself, on every push.
#     apps/common/tests/test_mutation_registries.py refuses one that names a test nobody defines.
#
# A name is the mutation, hashed (scripts/mutation_naming.py), so an entry follows its mutant through
# any edit that leaves the mutation in place and stops resolving the moment one does not. Read the
# names and diffs off `python -m scripts.toolbox.triage <report> --diffs`.
#
# Quote the name: TOML reads a bare `[a.b.c]` as nested tables, so an unquoted entry matches nothing.
#
# A function mutmut's tracing cannot attribute to any test at all belongs in mutation-exemptions.toml
# instead, which is keyed by function.

