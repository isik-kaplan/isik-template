["apps.users.api.viewsets.user.x__mark_partial__mutmut__1a1b3d6410e6"]
reason = """Flips `serializer.partial = True` to False. Nothing in UserSerializer is required
(id/created_at/updated_at are read-only, username/email are read-only on update via
create_only_fields, first_name/last_name/language are all blank=True), and ModelSerializer.update()
only sets fields present in the request body regardless of `partial` - an empty-body PATCH returns 200
either way. Stops being equivalent the day a required field is added."""

["apps.users.api.viewsets.user.x__mark_partial__mutmut__de2cdac5f87a"]
reason = """Sets `serializer.partial = None` instead of True. DRF only ever reads `partial` for its
truth value, so None behaves as False - and False is equivalent here for the reason the entry above
gives: nothing in UserSerializer is required, so partial validation and full validation agree."""

