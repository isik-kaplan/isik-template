[project]
name = "isik-template"
version = "0.1.0"
description = "Cookiecutter template for isik/@isikk/core-based Django + Next.js apps."
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false
dev-dependencies = [
    "cookiecutter>=2.6.0",
    "jinja2-time>=0.2.0",
    "pytest>=8.0.0",
    "pytest-cookies>=0.7.0",
    "ruff>=0.9.0",
    "pre-commit>=3.0.0",
    "mutmut>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
fix = true
# Unrendered Jinja there doesn't parse as Python.
extend-exclude = ["[{][{]cookiecutter.repo_slug[}][}]"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
# Rendered by cookiecutter before they run: an unquoted `{{ cookiecutter.x }}` reads to Python as a name.
"hooks/*_gen_project.py" = ["F821"]

[tool.ruff.format]
# Same files: the formatter would respace `{{ cookiecutter.x }}` into `{{cookiecutter.x}}`.
exclude = ["hooks/*_gen_project.py"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["hooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mutmut]
source_paths = ["hooks"]
# Templated hooks run as subprocesses mutmut can't trace; real bakes cover them instead.
do_not_mutate = ["hooks/pre_gen_project.py", "hooks/post_gen_project.py"]
pytest_add_cli_args = ["tests/test_pre_gen_validate.py"]
