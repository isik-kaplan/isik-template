repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-json
        # Some generated JSON is only valid once rendered; the baked project checks it.
        exclude: ^\{\{cookiecutter\.repo_slug\}\}/
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      # Ruff would read the templated pyproject.toml as config.
      - id: ruff
        args: [--fix]
        exclude: ^\{\{cookiecutter\.repo_slug\}\}/
      - id: ruff-format
        exclude: ^\{\{cookiecutter\.repo_slug\}\}/
